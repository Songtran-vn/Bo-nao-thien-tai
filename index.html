<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brilliant Minds — Nói chuyện với 10 bộ não vĩ đại</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #c9a84c; --gold-light: #f0e0a0;
    --text: #e8e0d0; --text-dim: rgba(232,224,208,0.55);
    --text-faint: rgba(232,224,208,0.3); --bg: #080808;
  }
  html, body { min-height: 100%; background: var(--bg); font-family: 'Crimson Pro', Georgia, serif; color: var(--text); overflow-x: hidden; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

  #grid-view { max-width: 1200px; margin: 0 auto; padding: 48px 20px 80px; }
  .page-header { text-align: center; margin-bottom: 56px; }
  .header-decor { color: var(--gold); font-size: 13px; letter-spacing: 10px; margin-bottom: 14px; }
  .page-title {
    font-family: 'Cinzel', serif; font-size: clamp(38px,7vw,80px); font-weight: 900; letter-spacing: 0.1em;
    background: linear-gradient(90deg,#c9a84c,#f0e0a0,#c9a84c,#f0e0a0); background-size: 200% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: shimmer 3.5s linear infinite; margin-bottom: 18px;
  }
  .page-sub { font-size: 19px; color: var(--text-dim); font-style: italic; margin-bottom: 14px; }
  .minds-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(195px,1fr)); gap: 18px; }

  .mind-card {
    border-radius: 18px; padding: 24px 20px 20px;
    border: 1px solid rgba(255,255,255,0.07); cursor: pointer;
    position: relative; overflow: hidden;
    transition: transform 0.35s cubic-bezier(0.175,0.885,0.32,1.275), box-shadow 0.35s ease;
  }
  .mind-card:hover { transform: translateY(-9px) scale(1.025); }
  .card-glow { position: absolute; top: -40px; right: -40px; width: 130px; height: 130px; border-radius: 50%; filter: blur(35px); pointer-events: none; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; position: relative; }
  .card-portrait { font-size: 44px; line-height: 1; }
  .card-badge { font-size: 18px; padding: 5px 9px; border-radius: 10px; border: 1px solid; }
  .card-name { font-family: 'Cinzel',serif; font-size: 14.5px; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 5px; position: relative; }
  .card-title-text { font-size: 12.5px; color: var(--text-dim); font-style: italic; line-height: 1.45; margin-bottom: 5px; position: relative; }
  .card-years { font-size: 11.5px; color: var(--text-faint); position: relative; }
  .card-line { height: 2px; border-radius: 1px; margin-top: 18px; opacity: 0.55; }

  #chat-view { display: none; flex-direction: column; min-height: 100vh; }
  #chat-view.active { display: flex; }
  .chat-header {
    display: flex; align-items: center; gap: 14px; padding: 14px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.09);
    background: rgba(0,0,0,0.45); backdrop-filter: blur(14px);
    position: sticky; top: 0; z-index: 10;
  }
  .back-btn {
    padding: 8px 16px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.07); color: var(--text-dim);
    font-family: 'Crimson Pro',serif; font-size: 15px; cursor: pointer;
    transition: background 0.2s; white-space: nowrap;
  }
  .back-btn:hover { background: rgba(255,255,255,0.14); }
  .chat-mind-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  .chat-portrait { font-size: 34px; flex-shrink: 0; }
  .chat-name { font-family: 'Cinzel',serif; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-title-label { font-size: 12px; color: var(--text-dim); font-style: italic; }
  .live-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; animation: glowPulse 2s ease infinite; }

  .messages-area {
    flex: 1; overflow-y: auto; padding: 28px 16px 20px;
    display: flex; flex-direction: column; gap: 18px;
    max-width: 820px; width: 100%; margin: 0 auto;
  }
  .msg-row { display: flex; gap: 10px; align-items: flex-end; animation: fadeUp 0.3s ease forwards; }
  .msg-row.user { justify-content: flex-end; }
  .msg-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; }
  .bubble { max-width: 74%; padding: 13px 17px; font-size: 16.5px; line-height: 1.65; font-family: 'Crimson Pro',serif; }
  .bubble.ai { border-radius: 17px 17px 17px 4px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: var(--text); }
  .bubble.user { border-radius: 17px 17px 4px 17px; color: #000; font-weight: 600; }

  .typing-indicator { display: flex; gap: 5px; align-items: center; padding: 14px 18px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; animation: typingPulse 1.2s ease infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  .input-area { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.09); background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
  .input-inner { display: flex; gap: 10px; align-items: flex-end; max-width: 820px; margin: 0 auto; }
  #msg-input {
    flex: 1; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 13px; padding: 12px 16px; color: var(--text); font-size: 16px;
    font-family: 'Crimson Pro',serif; resize: none; outline: none; line-height: 1.5;
    max-height: 140px; overflow-y: auto; transition: border-color 0.2s;
  }
  #send-btn {
    width: 48px; height: 48px; border-radius: 13px; border: none; font-size: 18px; font-weight: 700;
    flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, opacity 0.15s;
  }
  #send-btn:hover { transform: scale(1.08); opacity: 0.88; }
  #send-btn:active { transform: scale(0.94); }
  #send-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

  @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes typingPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.3;transform:scale(0.8)} }
  @keyframes glowPulse { 0%,100%{box-shadow:0 0 6px currentColor} 50%{box-shadow:0 0 14px currentColor} }

  @media(max-width:600px){
    .minds-grid{grid-template-columns:repeat(2,1fr);gap:12px}
    .mind-card{padding:18px 14px 16px} .card-portrait{font-size:36px}
    .bubble{max-width:85%;font-size:15px} .chat-name{font-size:15px}
  }
</style>

<div id="grid-view">
  <div class="page-header">
    <div class="header-decor">✦ &nbsp; ✦ &nbsp; ✦</div>
    <h1 class="page-title">BRILLIANT MINDS</h1>
    <p class="page-sub">Nói chuyện với 10 bộ não vĩ đại nhất lịch sử nhân loại</p>
    <div class="header-decor">✦ &nbsp; ✦ &nbsp; ✦</div>

<div id="chat-view">

  <div class="messages-area" id="messages-area"></div>
  <div class="input-area">

      <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

let currentMind = null;
let chatHistory = [];
let isLoading = false;

// Build grid
const grid = document.getElementById('minds-grid');
MINDS.forEach(mind => {
  const card = document.createElement('div');
  card.className = 'mind-card';
  card.style.background = mind.bg;
  card.innerHTML = `
    <div class="card-glow" style="background:${mind.color}25"></div>
    <div class="card-top">
      <span class="card-portrait">${mind.portrait}</span>
      <span class="card-badge" style="color:${mind.color};border-color:${mind.color}50;background:${mind.color}18">${mind.emoji}</span>
    </div>
    <div class="card-name" style="color:${mind.color}">${mind.name}</div>
    <div class="card-title-text">${mind.title}</div>
    <div class="card-years">${mind.years}</div>
    <div class="card-line" style="background:${mind.color}"></div>
  `;
  card.addEventListener('mouseenter', () => {
    card.style.boxShadow = `0 20px 55px rgba(0,0,0,0.65), 0 0 35px ${mind.color}40`;
  });
  card.addEventListener('mouseleave', () => { card.style.boxShadow = ''; });
  card.addEventListener('click', () => openChat(mind));
  grid.appendChild(card);
});

function openChat(mind) {
  currentMind = mind;
  chatHistory = [];
  document.getElementById('chat-portrait').textContent = mind.portrait;
  document.getElementById('chat-name').textContent = mind.name;
  document.getElementById('chat-name').style.color = mind.color;
  document.getElementById('chat-title-label').textContent = mind.title;
  document.getElementById('live-dot').style.background = mind.color;
  document.getElementById('live-dot').style.color = mind.color;
  document.getElementById('msg-input').placeholder = `Hỏi ${mind.name} điều gì đó...`;
  document.getElementById('msg-input').style.borderColor = mind.color + '55';
  document.getElementById('send-btn').style.background = mind.color;
  document.getElementById('send-btn').style.color = '#000';
  document.getElementById('chat-view').style.background = mind.bg;
  document.getElementById('messages-area').innerHTML = '';
  addMessage('assistant', `Xin chào! Tôi là ${mind.name}. Hãy hỏi tôi bất cứ điều gì bạn muốn biết. Tôi rất vui được chia sẻ những suy nghĩ và trải nghiệm của mình với bạn.`);
  document.getElementById('grid-view').style.display = 'none';
  document.getElementById('chat-view').classList.add('active');
  document.getElementById('msg-input').focus();
}

function goBack() {
  document.getElementById('chat-view').classList.remove('active');
  document.getElementById('grid-view').style.display = '';
  currentMind = null; chatHistory = [];
}

function addMessage(role, text) {
  const area = document.getElementById('messages-area');
  const row = document.createElement('div');
  row.className = `msg-row ${role === 'user' ? 'user' : ''}`;
  if (role === 'assistant') {
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.textContent = currentMind.portrait;
    av.style.background = currentMind.color + '28';
    row.appendChild(av);
  }
  const bubble = document.createElement('div');
  bubble.className = `bubble ${role === 'user' ? 'user' : 'ai'}`;
  if (role === 'user') bubble.style.background = currentMind.color;
  else bubble.style.borderColor = currentMind.color + '40';
  bubble.textContent = text;
  row.appendChild(bubble);
  area.appendChild(row);
  area.scrollTop = area.scrollHeight;
}

function showTyping() {
  const area = document.getElementById('messages-area');
  const row = document.createElement('div');
  row.className = 'msg-row'; row.id = 'typing-row';
  const av = document.createElement('div');
  av.className = 'msg-avatar'; av.textContent = currentMind.portrait;
  av.style.background = currentMind.color + '28';
  row.appendChild(av);
  const bubble = document.createElement('div');
  bubble.className = 'bubble ai typing-indicator';
  bubble.style.borderColor = currentMind.color + '40';
  [1,2,3].forEach(() => {
    const dot = document.createElement('span');
    dot.className = 'dot'; dot.style.background = currentMind.color;
    bubble.appendChild(dot);
  });
  row.appendChild(bubble);
  area.appendChild(row);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-row');
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || isLoading) return;
  input.value = ''; input.style.height = 'auto';
  isLoading = true;
  document.getElementById('send-btn').disabled = true;

  addMessage('user', text);
  chatHistory.push({ role: 'user', parts: [{ text }] });
  showTyping();

  try {
    const res = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: currentMind.personality }] },
        contents: chatHistory,
        generationConfig: { maxOutputTokens: 1000, temperature: 0.9 }
      })
    });

    const data = await res.json();
    
    // Show exact error for debugging
    if (!res.ok || data.error) {
      const errMsg = data.error?.message || data.error?.status || JSON.stringify(data.error) || 'Unknown error';
      removeTyping();
      addMessage('assistant', '❌ Lỗi API: ' + errMsg);
      return;
    }

    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Xin lỗi, tôi không thể trả lời lúc này.';
    removeTyping();
    addMessage('assistant', reply);
    chatHistory.push({ role: 'model', parts: [{ text: reply }] });
  } catch (err) {
    removeTyping();
    addMessage('assistant', '❌ Lỗi kết nối: ' + err.message);
  } finally {
    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }
}

document.getElementById('msg-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 140) + 'px';
});
document.getElementById('msg-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
</script>
</body>
</html>
